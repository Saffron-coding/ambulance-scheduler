{% extends "base.html" %}
{% block content %}

<div style="display: flex; justify-content: flex-end; margin-bottom: 15px;">
    <a href="{{ url_for('main.add_ambulance') }}">Create Ambulance</a>
</div>

<h2>All Ambulances</h2>

<table class="styled-table">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Location</th>
            <th>Available From</th>
        </tr>
    </thead>
    <tbody>
        {% for ambulance in ambulances %}
        <tr>
            <td>{{ ambulance.id }}</td>
            <td>{{ ambulance.name }}</td>
            <td>{{ ambulance.location }}</td>
            <td>{{ ambulance.available_from }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
